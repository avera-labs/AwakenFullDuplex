<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1040" viewBox="0 0 1060 1040" role="img" aria-labelledby="title desc">
<title id="title">GRPO: align each reward with its responsible frames</title><desc id="desc">Two schematic frame grids show text tokens, W/S/P classes, and separate credit masks. In an acknowledgment, onset advantage A1 lands at Right, text-ending A2 at first SIL, release A3 at first PAD, and exact-token form advantage A4 at Right and punctuation. In a short reply, onset advantage A5 lands at the first word and length advantage A6 at first SIL; there is no backchannel form credit. Each column is 200 milliseconds. Advantage signs depend on comparison with sampled peers.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto"><path stroke-linecap="round" stroke-linejoin="round" d="M1 1 L7 4 L1 7" fill="none" stroke="#71839c" stroke-width="1.3"/></marker></defs>
<rect width="1060" height="1040" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#202b3c"><text x="36" y="42" font-size="26">GRPO: align each reward with its responsible frames</text><text x="36" y="78" font-size="17">Each column is one 200 ms frame · illustrative tokens and event masks</text><text x="36" y="125" font-size="21">A. Completed acknowledgment while the user continues speaking</text><text x="312" y="160" font-size="14">f0</text><path stroke-linecap="round" stroke-linejoin="round" d="M300 169 V420" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="412" y="160" font-size="14">f1</text><path stroke-linecap="round" stroke-linejoin="round" d="M400 169 V420" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="512" y="160" font-size="14">f2</text><path stroke-linecap="round" stroke-linejoin="round" d="M500 169 V420" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="612" y="160" font-size="14">f3</text><path stroke-linecap="round" stroke-linejoin="round" d="M600 169 V420" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="712" y="160" font-size="14">f4</text><path stroke-linecap="round" stroke-linejoin="round" d="M700 169 V420" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="812" y="160" font-size="14">f5</text><path stroke-linecap="round" stroke-linejoin="round" d="M800 169 V420" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="912" y="160" font-size="14">f6</text><path stroke-linecap="round" stroke-linejoin="round" d="M900 169 V420" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="36" y="200" font-size="16">Text / control</text><rect x="302" y="175" width="94" height="35" rx="5" fill="#edf0f5"/><text x="312" y="199" font-size="15">PAD</text><rect x="402" y="175" width="94" height="35" rx="5" fill="#edf0f5"/><text x="412" y="199" font-size="15">Right</text><rect x="502" y="175" width="94" height="35" rx="5" fill="#edf0f5"/><text x="512" y="199" font-size="15">.</text><rect x="602" y="175" width="94" height="35" rx="5" fill="#edf0f5"/><text x="612" y="199" font-size="15">SIL</text><rect x="702" y="175" width="94" height="35" rx="5" fill="#edf0f5"/><text x="712" y="199" font-size="15">SIL</text><rect x="802" y="175" width="94" height="35" rx="5" fill="#edf0f5"/><text x="812" y="199" font-size="15">PAD</text><rect x="902" y="175" width="94" height="35" rx="5" fill="#edf0f5"/><text x="912" y="199" font-size="15">PAD</text><text x="36" y="243" font-size="16">Token group</text><rect x="302" y="218" width="94" height="35" rx="5" fill="#edf0f5"/><text x="312" y="242" font-size="15">P</text><rect x="402" y="218" width="94" height="35" rx="5" fill="#edf0f5"/><text x="412" y="242" font-size="15">W</text><rect x="502" y="218" width="94" height="35" rx="5" fill="#edf0f5"/><text x="512" y="242" font-size="15">W</text><rect x="602" y="218" width="94" height="35" rx="5" fill="#edf0f5"/><text x="612" y="242" font-size="15">S</text><rect x="702" y="218" width="94" height="35" rx="5" fill="#edf0f5"/><text x="712" y="242" font-size="15">S</text><rect x="802" y="218" width="94" height="35" rx="5" fill="#edf0f5"/><text x="812" y="242" font-size="15">P</text><rect x="902" y="218" width="94" height="35" rx="5" fill="#edf0f5"/><text x="912" y="242" font-size="15">P</text><text x="36" y="286" font-size="16">Action · onset</text><text x="312" y="285" font-size="15">—</text><rect x="402" y="261" width="94" height="35" rx="5" fill="#e8eef9"/><text x="412" y="285" font-size="15">A1</text><text x="512" y="285" font-size="15">—</text><text x="612" y="285" font-size="15">—</text><text x="712" y="285" font-size="15">—</text><text x="812" y="285" font-size="15">—</text><text x="912" y="285" font-size="15">—</text><text x="36" y="329" font-size="16">Action · text ending</text><text x="312" y="328" font-size="15">—</text><text x="412" y="328" font-size="15">—</text><text x="512" y="328" font-size="15">—</text><rect x="602" y="304" width="94" height="35" rx="5" fill="#e8eef9"/><text x="612" y="328" font-size="15">A2</text><text x="712" y="328" font-size="15">—</text><text x="812" y="328" font-size="15">—</text><text x="912" y="328" font-size="15">—</text><text x="36" y="372" font-size="16">Action · speech release</text><text x="312" y="371" font-size="15">—</text><text x="412" y="371" font-size="15">—</text><text x="512" y="371" font-size="15">—</text><text x="612" y="371" font-size="15">—</text><text x="712" y="371" font-size="15">—</text><rect x="802" y="347" width="94" height="35" rx="5" fill="#e8eef9"/><text x="812" y="371" font-size="15">A3</text><text x="912" y="371" font-size="15">—</text><text x="36" y="415" font-size="16">Token · brief form</text><text x="312" y="414" font-size="15">—</text><rect x="402" y="390" width="94" height="35" rx="5" fill="#eeeafa"/><text x="412" y="414" font-size="15">A4</text><rect x="502" y="390" width="94" height="35" rx="5" fill="#eeeafa"/><text x="512" y="414" font-size="15">A4</text><text x="612" y="414" font-size="15">—</text><text x="712" y="414" font-size="15">—</text><text x="812" y="414" font-size="15">—</text><text x="912" y="414" font-size="15">—</text><text x="36" y="475" font-size="17">At f1, onset credit uses p(W + S); form credit separately uses p(“Right”).</text><text x="36" y="503" font-size="17">At f3, text-ending credit uses p(S + P). At f5, release credit uses p(P).</text><text x="36" y="531" font-size="16">A4 also applies to the sampled punctuation token at f2; it is not spread onto SIL or PAD.</text><text x="36" y="590" font-size="21">B. A reply stops too short relative to its reference</text><text x="312" y="625" font-size="14">f0</text><path stroke-linecap="round" stroke-linejoin="round" d="M300 634 V885" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="412" y="625" font-size="14">f1</text><path stroke-linecap="round" stroke-linejoin="round" d="M400 634 V885" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="512" y="625" font-size="14">f2</text><path stroke-linecap="round" stroke-linejoin="round" d="M500 634 V885" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="612" y="625" font-size="14">f3</text><path stroke-linecap="round" stroke-linejoin="round" d="M600 634 V885" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="712" y="625" font-size="14">f4</text><path stroke-linecap="round" stroke-linejoin="round" d="M700 634 V885" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="812" y="625" font-size="14">f5</text><path stroke-linecap="round" stroke-linejoin="round" d="M800 634 V885" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="912" y="625" font-size="14">f6</text><path stroke-linecap="round" stroke-linejoin="round" d="M900 634 V885" stroke="#e7ecf3" stroke-dasharray="3 4"/><text x="36" y="665" font-size="16">Text / control</text><rect x="302" y="640" width="94" height="35" rx="5" fill="#edf0f5"/><text x="312" y="664" font-size="15">PAD</text><rect x="402" y="640" width="94" height="35" rx="5" fill="#edf0f5"/><text x="412" y="664" font-size="15">I</text><rect x="502" y="640" width="94" height="35" rx="5" fill="#edf0f5"/><text x="512" y="664" font-size="15">suggest</text><rect x="602" y="640" width="94" height="35" rx="5" fill="#edf0f5"/><text x="612" y="664" font-size="15">tea</text><rect x="702" y="640" width="94" height="35" rx="5" fill="#edf0f5"/><text x="712" y="664" font-size="15">.</text><rect x="802" y="640" width="94" height="35" rx="5" fill="#edf0f5"/><text x="812" y="664" font-size="15">SIL</text><rect x="902" y="640" width="94" height="35" rx="5" fill="#edf0f5"/><text x="912" y="664" font-size="15">PAD</text><text x="36" y="708" font-size="16">Token group</text><rect x="302" y="683" width="94" height="35" rx="5" fill="#edf0f5"/><text x="312" y="707" font-size="15">P</text><rect x="402" y="683" width="94" height="35" rx="5" fill="#edf0f5"/><text x="412" y="707" font-size="15">W</text><rect x="502" y="683" width="94" height="35" rx="5" fill="#edf0f5"/><text x="512" y="707" font-size="15">W</text><rect x="602" y="683" width="94" height="35" rx="5" fill="#edf0f5"/><text x="612" y="707" font-size="15">W</text><rect x="702" y="683" width="94" height="35" rx="5" fill="#edf0f5"/><text x="712" y="707" font-size="15">W</text><rect x="802" y="683" width="94" height="35" rx="5" fill="#edf0f5"/><text x="812" y="707" font-size="15">S</text><rect x="902" y="683" width="94" height="35" rx="5" fill="#edf0f5"/><text x="912" y="707" font-size="15">P</text><text x="36" y="751" font-size="16">Action · onset</text><text x="312" y="750" font-size="15">—</text><rect x="402" y="726" width="94" height="35" rx="5" fill="#e8eef9"/><text x="412" y="750" font-size="15">A5</text><text x="512" y="750" font-size="15">—</text><text x="612" y="750" font-size="15">—</text><text x="712" y="750" font-size="15">—</text><text x="812" y="750" font-size="15">—</text><text x="912" y="750" font-size="15">—</text><text x="36" y="794" font-size="16">Action · reply length</text><text x="312" y="793" font-size="15">—</text><text x="412" y="793" font-size="15">—</text><text x="512" y="793" font-size="15">—</text><text x="612" y="793" font-size="15">—</text><text x="712" y="793" font-size="15">—</text><rect x="802" y="769" width="94" height="35" rx="5" fill="#e8eef9"/><text x="812" y="793" font-size="15">A6</text><text x="912" y="793" font-size="15">—</text><text x="36" y="837" font-size="16">Token · BC form</text><text x="312" y="836" font-size="15">—</text><text x="412" y="836" font-size="15">—</text><text x="512" y="836" font-size="15">—</text><text x="612" y="836" font-size="15">—</text><text x="712" y="836" font-size="15">—</text><text x="812" y="836" font-size="15">—</text><text x="912" y="836" font-size="15">—</text><text x="36" y="902" font-size="17">A6 targets the first non-content frame (f5), using p(S + P), rather than the answer’s words.</text><text x="36" y="930" font-size="16">A below-group-average length score discourages stopping here. Reply words still receive reference KL.</text><text x="36" y="978" font-size="15">A1 … A6 denote event-specific group-relative advantages, not raw reward values; their signs depend on the group.</text><text x="36" y="1005" font-size="15">— = no credit from that row. Tokens are schematic, not a recorded tokenizer output; omitted signals may also apply.</text></g></svg>
