<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-labelledby="title desc">
<title id="title">GRPO: credit the decision that shapes the interaction</title><desc id="desc">Illustrative acknowledgment: user speech continues while the assistant listens, says Right, finishes its speech, and returns to listening. Onset credit goes to the first content frame, text-ending credit to the first non-content frame, release credit to PAD, and exact-token brief-response credit to content positions. A reply after user turn end receives projected onset and length credit at the relevant decisions, without the backchannel token-form reward. Timing and token widths are schematic.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto"><path stroke-linecap="round" stroke-linejoin="round" d="M1 1 L7 4 L1 7" fill="none" stroke="#71839c" stroke-width="1.3"/></marker></defs>
<rect width="1180" height="800" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#202b3c"><text x="36" y="42" font-size="26">GRPO: credit the decision that shapes the interaction</text><text x="36" y="78" font-size="17">Illustrative continuations · markers show where behavioral rewards are applied</text><text x="36" y="122" font-size="21">A brief acknowledgment while the user continues speaking</text><text x="36" y="169" font-size="16">User</text><rect x="200" y="143" width="900" height="40" rx="12" fill="#edf0f5" stroke="#bdc9d8"/><text x="220" y="169" font-size="17">“We tried the earlier train, and then we …”</text><text x="36" y="229" font-size="16">Assistant</text><rect x="200" y="202" width="146" height="44" rx="7" fill="#edf0f5"/><text x="212" y="230" font-size="16">Listening</text><rect x="350" y="202" width="151" height="44" rx="7" fill="#eeeafa"/><text x="362" y="230" font-size="16">“Right.”</text><rect x="505" y="202" width="176" height="44" rx="7" fill="#fff2dc"/><text x="517" y="230" font-size="16">Speech finishes</text><rect x="685" y="202" width="411" height="44" rx="7" fill="#edf0f5"/><text x="697" y="230" font-size="16">Listening</text><path stroke-linecap="round" stroke-linejoin="round" d="M350 247 V278" stroke="#71839c" stroke-width="1.4"/><circle cx="350" cy="292" r="14" fill="#e8eef9"/><text x="345" y="298" font-size="16">1</text><path stroke-linecap="round" stroke-linejoin="round" d="M505 247 V278" stroke="#71839c" stroke-width="1.4"/><circle cx="505" cy="292" r="14" fill="#e8eef9"/><text x="500" y="298" font-size="16">2</text><path stroke-linecap="round" stroke-linejoin="round" d="M685 247 V278" stroke="#71839c" stroke-width="1.4"/><circle cx="685" cy="292" r="14" fill="#e8eef9"/><text x="680" y="298" font-size="16">3</text><path stroke-linecap="round" stroke-linejoin="round" d="M352 198 V190 H501 V198" fill="none" stroke="#8a79b5" stroke-width="1.4"/><text x="720" y="274" font-size="16">Content tokens also receive</text><text x="720" y="296" font-size="16">the brief-response form score.</text><rect x="36" y="330" width="350" height="120" rx="12" fill="#e8eef9" stroke="#bdc9d8"/><text x="52" y="359" font-size="17">1  Start the acknowledgment</text><text x="52" y="384" font-size="17">Score onset and spacing.</text><text x="52" y="409" font-size="17">Credit the speech-start decision.</text><rect x="412" y="330" width="350" height="120" rx="12" fill="#edf0f5" stroke="#bdc9d8"/><text x="428" y="359" font-size="17">2  Finish the words</text><text x="428" y="384" font-size="17">Check the text ending.</text><text x="428" y="409" font-size="17">Credit the first non-content token.</text><rect x="788" y="330" width="350" height="120" rx="12" fill="#edf0f5" stroke="#bdc9d8"/><text x="804" y="359" font-size="17">3  Return to listening</text><text x="804" y="384" font-size="17">Check timely speech release.</text><text x="804" y="409" font-size="17">Credit the release PAD frame.</text><text x="36" y="490" font-size="21">A substantive reply after the user finishes</text><text x="36" y="536" font-size="16">User</text><rect x="200" y="510" width="310" height="40" rx="12" fill="#edf0f5" stroke="#bdc9d8"/><text x="215" y="537" font-size="16">“… what would you suggest?”</text><path stroke-linecap="round" stroke-linejoin="round" d="M510 505 V616" stroke="#bdc9d8" stroke-dasharray="4 4"/><text x="526" y="533" font-size="15">User turn ends</text><text x="36" y="590" font-size="16">Assistant</text><rect x="200" y="563" width="306" height="44" rx="7" fill="#edf0f5"/><text x="212" y="591" font-size="16">Listening</text><rect x="510" y="563" width="386" height="44" rx="7" fill="#eeeafa"/><text x="522" y="591" font-size="16">Substantive answer …</text><rect x="900" y="563" width="196" height="44" rx="7" fill="#fff2dc"/><text x="912" y="591" font-size="16">Words stop</text><path stroke-linecap="round" stroke-linejoin="round" d="M510,656 L510,611" fill="none" stroke="#71839c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="345" y="680" font-size="16">Onset score → start decision</text><path stroke-linecap="round" stroke-linejoin="round" d="M900,656 L900,611" fill="none" stroke="#71839c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="735" y="680" font-size="16">Length score → stop decision</text><text x="200" y="720" font-size="16">Reply rewards target interaction decisions; the body words receive no BC token-form reward.</text><text x="36" y="769" font-size="15">Schematic, not a recorded sample or a time scale. Each signal is compared across sampled continuations.</text></g></svg>
