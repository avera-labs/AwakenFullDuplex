<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Two supervised stages, then targeted reinforcement learning</title><desc id="desc">Base with adapted ear proceeds through SFT1, an equal base blend of backbone and speech head retaining the ear, SFT2 with replay, and backchannel-focused GRPO.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto"><path stroke-linecap="round" stroke-linejoin="round" d="M1 1 L7 4 L1 7" fill="none" stroke="#71839c" stroke-width="1.3"/></marker></defs>
<rect width="1100" height="560" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#202b3c"><text x="36" y="42" font-size="26">Two supervised stages, then targeted reinforcement learning</text><text x="36" y="78" font-size="16">Selected recipe · the stage-2 initialization includes an explicit base-weight blend</text><rect x="36" y="120" width="280" height="110" rx="12" fill="#e8eef9" stroke="#bdc9d8"/><text x="52" y="149" font-size="17">Fun-Audio-Chat base</text><text x="52" y="174" font-size="17">+ separately adapted</text><text x="52" y="199" font-size="17">incoming-audio encoder</text><rect x="380" y="120" width="280" height="110" rx="12" fill="#edf0f5" stroke="#bdc9d8"/><text x="396" y="149" font-size="17">SFT 1</text><text x="396" y="174" font-size="17">64,000 records · 1,000 steps</text><text x="396" y="199" font-size="17">Batch 64 · up to 180 s</text><path stroke-linecap="round" stroke-linejoin="round" d="M316,175 L380,175" fill="none" stroke="#71839c" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="725" y="120" width="335" height="110" rx="12" fill="#e8eef9" stroke="#bdc9d8"/><text x="741" y="149" font-size="17">Stage-2 initialization</text><text x="741" y="174" font-size="17">½ SFT 1 + ½ base</text><text x="741" y="199" font-size="17">Backbone + speech head</text><path stroke-linecap="round" stroke-linejoin="round" d="M660,175 L725,175" fill="none" stroke="#71839c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="735" y="260" font-size="17">Retain the SFT-1 audio encoder</text><rect x="725" y="315" width="335" height="110" rx="12" fill="#edf0f5" stroke="#bdc9d8"/><text x="741" y="344" font-size="17">SFT 2</text><text x="741" y="369" font-size="17">100,132 records</text><text x="741" y="394" font-size="17">Includes 6,780 replay records</text><path stroke-linecap="round" stroke-linejoin="round" d="M890,230 L890,315" fill="none" stroke="#71839c" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="290" y="315" width="355" height="110" rx="12" fill="#e8eef9" stroke="#bdc9d8"/><text x="306" y="344" font-size="17">BC-focused GRPO</text><text x="306" y="369" font-size="17">Selected policy: round 160</text><text x="306" y="394" font-size="17">Top 6 backbone blocks + norm/head</text><path stroke-linecap="round" stroke-linejoin="round" d="M725,370 L645,370" fill="none" stroke="#71839c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="36" y="490" font-size="17">SFT mixtures include initial backchannel examples; GRPO develops this starting behavior.</text><text x="36" y="522" font-size="17">GRPO freezes the ear, fusion, speech head, embeddings, and lower backbone blocks.</text></g></svg>
