<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="875" viewBox="0 0 1460 875" role="img" aria-labelledby="title desc">
<title id="title">Composing continuous interaction</title><desc id="desc">Three clean timelines depict floor transfer, user interruption with onset-to-stop delay, and a backchannel followed by a reply. Separate annotation cards list FTO range, interruption position range, stop-delay range, and duration constraints.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto"><path stroke-linecap="round" stroke-linejoin="round" d="M1 1 L7 4 L1 7" fill="none" stroke="#71839c" stroke-width="1.3"/></marker></defs>
<rect width="1460" height="875" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#202b3c"><text x="36" y="42" font-size="26">Composing continuous interaction</text><text x="36" y="76" font-size="17">Illustrative timing recipes · positions are schematic, not measured response latency</text><text x="36" y="130" font-size="21">Turn handoff</text><text x="36" y="183" font-size="16">User</text><path stroke-linecap="round" stroke-linejoin="round" d="M175 177 H960" stroke="#e7ecf3" stroke-width="1.4"/><text x="36" y="243" font-size="16">Assistant</text><path stroke-linecap="round" stroke-linejoin="round" d="M175 237 H960" stroke="#e7ecf3" stroke-width="1.4"/><rect x="185" y="160" width="300" height="34" rx="6" fill="#e5f3f7" stroke="#d0d9e5"/><text x="197" y="183" font-size="16">User utterance</text><rect x="595" y="220" width="340" height="34" rx="6" fill="#eeeafa" stroke="#d0d9e5"/><text x="607" y="243" font-size="16">Assistant reply</text><path stroke-linecap="round" stroke-linejoin="round" d="M485 194 V213 M595 213 V220 M485 207 H595" fill="none" stroke="#71839c" stroke-width="1.4"/><text x="519" y="200" font-size="14">FTO</text><rect x="1000" y="145" width="420" height="150" rx="12" fill="#f6f8fc"/><text x="1020" y="175" font-size="16">FTO = next onset − previous voice end</text><text x="1020" y="202" font-size="16">Sampled range: -0.6 to +1.0 s</text><text x="1020" y="229" font-size="16">Positive: gap · negative: overlap</text><text x="1020" y="256" font-size="16">Same-speaker gap: 0.3–0.6 s</text><text x="36" y="350" font-size="21">User interruption</text><text x="36" y="408" font-size="16">User</text><path stroke-linecap="round" stroke-linejoin="round" d="M175 402 H960" stroke="#e7ecf3" stroke-width="1.4"/><text x="36" y="478" font-size="16">Assistant</text><path stroke-linecap="round" stroke-linejoin="round" d="M175 472 H960" stroke="#e7ecf3" stroke-width="1.4"/><rect x="520" y="385" width="415" height="34" rx="6" fill="#e5f3f7" stroke="#d0d9e5"/><text x="532" y="408" font-size="16">User interruption</text><rect x="185" y="455" width="465" height="34" rx="6" fill="#eeeafa" stroke="#d0d9e5"/><text x="197" y="478" font-size="16">Assistant response</text><path stroke-linecap="round" stroke-linejoin="round" d="M520 426 V449 M650 437 V449 M520 437 H650" fill="none" stroke="#71839c" stroke-width="1.4"/><text x="535" y="432" font-size="14">Stop delay</text><path stroke-linecap="round" stroke-linejoin="round" d="M650 452 V493" stroke="#d19a44" stroke-width="1.4"/><path stroke-linecap="round" stroke-linejoin="round" d="M650 472 H935" stroke="#d0d9e5" stroke-width="1.4" stroke-dasharray="5 5"/><text x="690" y="510" font-size="14">Unspoken original tail</text><rect x="1000" y="368" width="420" height="196" rx="12" fill="#f6f8fc"/><text x="1020" y="398" font-size="16">Onset: 40–80% of original duration</text><text x="1020" y="425" font-size="16">Delay from user onset to assistant stop:</text><text x="1020" y="452" font-size="16">0–2 s; proposal has 20% at zero</text><text x="1020" y="479" font-size="16">Accept only if stop cuts off at least</text><text x="1020" y="506" font-size="16">2 s of the original assistant utterance</text><text x="1020" y="533" font-size="16">Ranges describe draws before rejection.</text><text x="36" y="615" font-size="21">Backchannel, then reply</text><text x="36" y="673" font-size="16">User</text><path stroke-linecap="round" stroke-linejoin="round" d="M175 667 H960" stroke="#e7ecf3" stroke-width="1.4"/><text x="36" y="733" font-size="16">Assistant</text><path stroke-linecap="round" stroke-linejoin="round" d="M175 727 H960" stroke="#e7ecf3" stroke-width="1.4"/><rect x="185" y="650" width="520" height="34" rx="6" fill="#e5f3f7" stroke="#d0d9e5"/><text x="197" y="673" font-size="16">User continues speaking</text><rect x="370" y="710" width="145" height="34" rx="6" fill="#eeeafa" stroke="#d0d9e5"/><text x="382" y="733" font-size="16">“mm-hmm”</text><rect x="795" y="710" width="140" height="34" rx="6" fill="#eeeafa" stroke="#d0d9e5"/><text x="807" y="733" font-size="16">Reply</text><text x="540" y="734" font-size="15">Listening</text><rect x="1000" y="635" width="420" height="135" rx="12" fill="#f6f8fc"/><text x="1020" y="665" font-size="16">Brief listener response during user speech</text><text x="1020" y="692" font-size="16">Return to listening before replying</text><text x="1020" y="719" font-size="16">Synthesized SFT examples provide</text><text x="1020" y="746" font-size="16">initial backchannel exposure.</text><text x="36" y="815" font-size="16">Blue: user · lavender: assistant · dashed tail: original speech removed by the interruption target</text><text x="36" y="846" font-size="16">Detailed sampling distributions and duration constraints are defined in the narrative.</text></g></svg>
